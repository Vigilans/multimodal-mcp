  "Each reference video or audio runs 2-15 s, with at most 15 s in total per type.",  # https://ark.volcengine.com/region:cn-beijing/docs/ark/create-video-generation-task-api §content.video_url.url, §content.audio_url.url: Seedance 2.0 series durations
  "Reference images and videos showing real human faces are rejected, except this account's Seedance outputs from the last 30 days, asset:// virtual avatars and authorized material.",  # https://ark.volcengine.com/region:cn-beijing/docs/ark/create-video-generation-task-api §content: real human faces in reference images and videos are unsupported, with the listed exceptions
  "seconds: 4-15, or -1 to let the model choose.",  # https://ark.volcengine.com/region:cn-beijing/docs/ark/create-video-generation-task-api §duration
