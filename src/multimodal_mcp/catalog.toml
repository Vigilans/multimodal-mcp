# Interface rules that tool descriptions show for the configured models.
# [<endpoint>] rules apply to every model on that endpoint. [<endpoint>.models.<name>] rules apply to one model:
# <name> is the vendor's standard API name without its date version, or a self-hosted model's Hugging Face repo ID,
# and aliases lists the model's other official names.
# A configured model matches <name> or an alias ignoring case and anything up to the last "/", either exactly or with
# a trailing date version (-YYMMDD or -YYYY-MM-DD).
# Rules are keyed by the tool whose description shows them, or by a category to show them in all of that category's
# tools. Each rule's comment gives its source: a doc URL and section, source code at a pinned version, or the observed
# error.

[ark]
image = [
  "Prompts work best within 300 Chinese characters or 600 English words.",  # https://www.volcengine.com/docs/82379/1541523 §prompt: recommended prompt length
  "Input images: jpeg, png, webp, bmp, tiff, gif, heic or heif, each up to 30 MB.",  # https://www.volcengine.com/docs/82379/1541523 §image: requirements for each input image
]
generate_video = [
  "Frames and references cannot be combined in one request.",  # https://ark.volcengine.com/region:cn-beijing/docs/ark/create-video-generation-task-api §content.role: first frame, first and last frames, and all-modal reference are three mutually exclusive scenarios
  "Reference videos must be public URLs or asset:// IDs.",  # https://ark.volcengine.com/region:cn-beijing/docs/ark/create-video-generation-task-api §content.video_url.url: a video URL or an asset ID; observed error: InvalidParameter ... reference_video must be provided as a web url
  "Requests are capped at 64 MB and local files are sent as base64, so pass large media as URLs or asset:// IDs.",  # https://ark.volcengine.com/region:cn-beijing/docs/ark/create-video-generation-task-api §content.image_url.url, §content.audio_url.url: request body at most 64 MB, no base64 for large files
  "Prompts work best within 500 Chinese characters or 1,000 English words.",  # https://ark.volcengine.com/region:cn-beijing/docs/ark/create-video-generation-task-api §content.text: recommended prompt length
]

