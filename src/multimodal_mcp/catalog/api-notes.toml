# API notes for the configured models: what each call accepts and does. Notes cover parameter values and ranges,
# required and unsupported parameters, input formats, sizes, counts and durations, inputs that cannot be combined,
# options fields, output formats, and side effects such as billing or retention.
# [<endpoint>] notes apply to every model on that endpoint. [<endpoint>.models.<name>] notes apply to one model:
# <name> is the vendor's standard API name without its date version, or a self-hosted model's Hugging Face repo ID,
# and aliases lists the model's other official names.
# A configured model matches <name> or an alias ignoring case and anything up to the last "/", either exactly or with
# a trailing date version (-YYMMDD or -YYYY-MM-DD).
# Notes are keyed by a tool, or by a category for all of that category's tools. Each note's comment gives its source:
# a doc URL and section, source code at a pinned version, or the observed error.

