# Prompt guides for model families, which get_model_guide returns: how to write each family's prompts from the
# vendors' own prompt-writing references, which get_model_guide downloads into references/<family>/.
# Each table is a model family:
#   category  the list_models category
#   models    globs over model IDs, matched on any endpoint, ignoring case, anything up to the last "/", and a date suffix
#   notes     which sections of the files to read for writing prompts and for fixing results, how their terms map to
#             the tool parameters, and what in them to skip; parameter facts belong in api-notes.toml
#   files     the upstream files; a family without files has only its notes
# Each file:
#   name      the local file name
#   kind      pe (rules or templates written for an agent or prompt rewriter) or guide (explanations and examples
#             written for people)
#   url       one URL, or {en = ..., zh = ...} for a source published in both languages
#   select    for an HTML page: the element holding the article, as tag#id or tag.class; it is saved as Markdown
#   skill     url is an agent-skills index.json; the file is the SKILL.md of the archive with this name
# Other URLs return Markdown or text, which is saved as is.
# Where the en and zh editions title a section differently, notes give both titles as "en" / "zh".

# image

[gpt-image]
category = "image"
models = ["gpt-image-*"]
notes = '''
Write the prompt by prompting.md: all of it except "Contents", "Transparent images", "Fallback-only execution controls" and "Where to find copy/paste recipes". Then start from the one recipe in sample-prompts.md that matches the use case, under "Generate", "Asset type templates (taxonomy-aligned)" or "Edit"; the text before "Generate" says how to adapt a recipe, apart from its CLI model notes. Image 1, Image 2 count the tool's images or references in order.
Both files serve Codex's imagegen skill, which runs its own image_gen tool or CLI and has its own SKILL.md. Quality, transparency, masks and size go in the tool parameters and options, as the API notes give. The files are written for gpt-image-2; their writing rules hold for the other GPT Image models.
To fix a result, read "Prompting fundamentals", "Refine an image across turns" and "Check the result" in image-prompting.md, and the one example under "Generate images", "Edit images" or "More workflows" closest to the task. The rest of image-prompting.md covers models, parameters and code.
'''
files = [
  { name = "prompting.md", kind = "pe", url = "https://raw.githubusercontent.com/openai/codex/main/codex-rs/skills/src/assets/samples/imagegen/references/prompting.md" },
  { name = "sample-prompts.md", kind = "pe", url = "https://raw.githubusercontent.com/openai/codex/main/codex-rs/skills/src/assets/samples/imagegen/references/sample-prompts.md" },
  { name = "image-prompting.md", kind = "guide", url = "https://developers.openai.com/api/docs/guides/image-prompting.md" },
]

[gemini-image]
category = "image"
models = ["gemini-*-image*"]
notes = '''
Write the prompt by prompt-guide.md, all of it except "Nano Banana", a product link, and by best-practices.md except "What's next?".
The Thought Signatures tip in best-practices.md is a feature of multi-turn API sessions; each tool call is a separate request, so refine a result by passing it to edit_image.
'''
files = [
  { name = "prompt-guide.md", kind = "guide", url = "https://deepmind.google/models/gemini-image/prompt-guide/", select = "main#page-content" },
  { name = "best-practices.md", kind = "guide", url = "https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/capabilities/gemini-image-generation-best-practices?hl=en", select = "div.devsite-article-body" },
]

[seedream]
category = "image"
models = ["doubao-seedream-*"]
notes = '''
Write the prompt by prompt-guide.md, all of it. Image 1, Image 2 count the tool's images or references in order. The en edition covers Seedream 4.0 to 4.5 and the zh edition 4.0 to 5.0, with the same rules.
With Seedream 5.0 pro or flash, an edit can target a point or a box. In editing-guide.md read only "Key step: Convert the target area into normalized coordinates" / "关键操作：将目标区域转换为归一化坐标" for the 0-999 coordinates, computed from pixel positions in the input image, "Scenarios" / "支持场景", "Prompt suggestions" / "Prompt 写法" and "Tips for specifying the subject" / "使用说明". The upload, canvas, code and generation steps belong to the guide's demo app.
'''
files = [
  { name = "prompt-guide.md", kind = "guide", url = { en = "https://ai.byteplus.com/ark/region:ap-southeast-1/docs/seedream-4-0-5-0-prompt-guide.md", zh = "https://ark.volcengine.com/region:cn-beijing/docs/seedream-4-0-5-0-prompt-guide.md" } },
  { name = "editing-guide.md", kind = "guide", url = { en = "https://ai.byteplus.com/ark/region:ap-southeast-1/docs/seedream-5-0-pro-editing-guide.md", zh = "https://ark.volcengine.com/region:cn-beijing/docs/seedream-5-0-pro-editing-guide.md" } },
]

[qwen-image]
category = "image"
models = ["qwen-image-*"]
notes = '''
Without input images, write the prompt by pe-t2i.txt. With input images, whether edit_image images or generate_image references, which both reach the model as input images, write it by pe-i2i.txt. Read only that one file, all of it except "Output format" / "Output Format", the rewriter's JSON reply: pass only the text it would put in rewritten_prompt as prompt. <image1>, <image2> count the input images in list order.
The ratio the rewriter would set in wh_ratio goes in size as WIDTHxHEIGHT; in pe-i2i.txt, "Output Size Determination" decides it, and when ratio_follow would name an input image, use that image's size. The closing line that introduces the user's request is part of the rewriter setup.
For a transparent image, read only "Transparent Image Generation (RGBA)" in model-card.md; its code samples are diffusers usage.
'''
files = [
  { name = "pe-t2i.txt", kind = "pe", url = "https://huggingface.co/Qwen/Qwen-Image-2.1-PE-T2I/resolve/main/system_prompt.txt" },
  { name = "pe-i2i.txt", kind = "pe", url = "https://huggingface.co/Qwen/Qwen-Image-2.1-PE-I2I/resolve/main/system_prompt.txt" },
  { name = "model-card.md", kind = "guide", url = "https://huggingface.co/Qwen/Qwen-Image-2.1/resolve/main/README.md" },
]

[minimax-image]
category = "image"
models = ["image-01*"]
notes = '''
MiniMax publishes no prompt-writing guide for image-01. Its API examples are short descriptive phrases, such as "A man in a white t-shirt, full-body, standing front view, outdoors, document style, film grain, photorealistic". Keep within the length in the API notes.
For a consistent character, pass one frontal photo of a single person as the reference.
'''

# asr

[openai-asr]
category = "asr"
models = ["whisper-*", "gpt-*-transcribe*"]
notes = '''
prompt is sample text the model imitates, not instructions. In speech-to-text.md read "Prompting" up to its streaming subsections; for gpt transcription models also "Add transcription context", for the kind of context prompt holds; for whisper-1 also "Using the prompt parameter" under "Improving reliability". The rest of the page is API usage.
whisper-prompting-guide.md covers whisper-1 only. Read the prose between its code cells, which shows how the prompt steers spelling and style, and skip the code and its output.
'''
files = [
  { name = "speech-to-text.md", kind = "guide", url = "https://developers.openai.com/api/docs/guides/speech-to-text.md" },
  { name = "whisper-prompting-guide.md", kind = "guide", url = "https://developers.openai.com/cookbook/examples/whisper_prompting_guide.md" },
]

[gemini-asr]
category = "asr"
models = ["gemini-*-transcribe"]
notes = '''
The guide's custom_vocabulary is the tool's hotwords, and its language hints are language. In transcribe.md read only "Custom vocabulary" and "Best practices"; the rest is API usage and output parsing, and the API notes give the limits.
To get both custom vocabulary and timings, which one call does not combine, run a plain transcription with hotwords and correct the timed transcript from it.
'''
files = [
  { name = "transcribe.md", kind = "guide", url = "https://aistudio.google.com/docs/transcribe.md" },
]

[moss-transcribe]
category = "asr"
models = ["moss-transcribe-*"]
notes = '''
prompt replaces the default instruction, which is the Chinese "Timestamped Diarization (Default)" recipe. Write it from a recipe in prompts.md, all of which is short, in the language of the audio.
For names and terms, use the "Hotword Hints" recipe, since the model reads them only from the prompt.
transcribe_audio_with_timestamps and speakers=true read the timestamped segments of the default format, so use the default or the hotword recipe with them. "Speaker-Only Transcription" suits transcribe_audio alone.
The recipes' mention of build_transcription_messages and subtitle tools refers to the repository's own scripts.
'''
files = [
  { name = "prompts.md", kind = "pe", url = "https://raw.githubusercontent.com/OpenMOSS/MOSS-Transcribe-Diarize/main/examples/prompts.md" },
]

