# video

[minimax-h3]
category = "video"
models = ["minimax-h3", "minimax-h3-max"]
notes = '''
The files describe the structured prompt that MiniMax's prompt rewriter produces, and the inputs decide which to read. With no inputs, or with frames, read base-en.txt, all of it: no inputs is T2VA, first_frame I2VA, first_frame and last_frame FL2VA, last_frame alone L2VA. With reference_images, reference_videos or reference_audios, read ref-en.txt, all of it, and from base-en.txt only "4. How to Write the Three Shared Core Sections", whose formats ref-en.txt shares.
Frame labels: <Picture 1> is first_frame, or last_frame when it is the only frame; <Picture 2> is last_frame.
Reference labels count each list in order: <Picture N> the reference images, <Video N> the reference videos. Audio numbers go first to each reference video that has sound, in video order, then to the reference audios, so one video with sound and one audio file give <Audio 1> for the video's sound and <Audio 2> for the file. Define an audio label only when the prompt uses that audio.
The shot count and timestamps fit seconds.
MiniMax-H3-Max on the MiniMax API expands a prompt by default, so a plain description also works there. When you write the structure, turn expansion off with the option in the API notes.
'''
files = [
  { name = "base-en.txt", kind = "pe", url = "https://raw.githubusercontent.com/MiniMax-AI/MiniMax-H3/main/skills/h3-prompt-writing/references/base-en.txt" },
  { name = "ref-en.txt", kind = "pe", url = "https://raw.githubusercontent.com/MiniMax-AI/MiniMax-H3/main/skills/h3-prompt-writing/references/ref-en.txt" },
]

[seedance-2-0]
category = "video"
models = ["doubao-seedance-2-0*", "doubao-seedance-2.0*"]
notes = '''
Write the prompt by sd2-pe.md. @Image N, @Video N and @Audio N count reference_images, reference_videos and reference_audios in list order; frames need no label.
sd2-pe.md is written for an agent that rewrites a user's prompt in an exchange. Skip "Role definition" / "角色定位", Step 0, the questions to the user in Step 3, and "Optimization" / "优化问题" and "Relevant principles" / "相关原则", which report the changes. Ask the user only when a missing detail would make the result unusable, pass the prompt text alone as prompt, and tell the user about substitutions in your reply.
To fix a result, read the matching problem under "FAQ" / "常见问题" in prompt-guide.md, and the case closest to the task under "Appendix: Prompt examples" / "附录：提示词案例".
'''
files = [
  { name = "sd2-pe.md", kind = "pe", skill = "sd2-pe", url = { en = "https://arkdocs-en.tos-ap-southeast-1.volces.com/skills/.well-known/agent-skills/index.json", zh = "https://arkdocs.tos-cn-beijing.volces.com/skills/.well-known/agent-skills/index.json" } },
  { name = "prompt-guide.md", kind = "guide", url = { en = "https://ai.byteplus.com/ark/region:ap-southeast-1/docs/seedance-2-0-prompt-guide.md", zh = "https://ark.volcengine.com/region:cn-beijing/docs/seedance-2-0-prompt-guide.md" } },
]

[seedance-2-5]
category = "video"
models = ["doubao-seedance-2-5*", "doubao-seedance-2.5*"]
notes = '''
Write the prompt by sd25-pe.md. Asset labels count reference_images, reference_videos and reference_audios in list order.
Skip "Self-update before triggering" / "触发前的自升级", whose command updates a locally installed copy of that skill, "When to Use" / "适用场景" and "Compatibility And Runtime Notes". Skip "Asset Specification Preflight" / "素材规格预检" and "7. Apply Task Parameter Rules" / "7. 应用任务参数规则" as well: the API notes give the input limits and the parameters each task locks. Read "Aspect Ratio and Duration Compatibility Gate" / "画幅与时长兼容性闸门", which decides the task and the declaration it adds to the prompt.
Under "Output Contract" / "输出合同", read "Default Delivery" / "默认交付", "Asset Reference Fidelity" / "素材引用保真" and the complete example. Pass only the media the prompt uses, so that 【Unused Assets】 has nothing to list and is left out. The asset, parameter and additional notes it appends after the prompt are for the user: put them in your reply, and set duration, aspect ratio and resolution in the tool parameters.
To fix a result, read the matching problem under "FAQ" / "常见问题" in prompt-guide.md, and the case closest to the task under "Prompt examples" / "提示词案例". Its "Get the skill" / "获取 Skill" describes installing sd25-pe, and its JPG error problem concerns the API.
'''
files = [
  { name = "sd25-pe.md", kind = "pe", skill = "sd25-pe", url = { en = "https://arkdocs-en.tos-ap-southeast-1.volces.com/skills/.well-known/agent-skills/index.json", zh = "https://arkdocs.tos-cn-beijing.volces.com/skills/.well-known/agent-skills/index.json" } },
  { name = "prompt-guide.md", kind = "guide", url = { en = "https://ai.byteplus.com/ark/region:ap-southeast-1/docs/seedance-2-5-prompt-guide.md", zh = "https://ark.volcengine.com/region:cn-beijing/docs/seedance-2-5-prompt-guide.md" } },
]

[gemini-omni]
category = "video"
models = ["gemini-omni-*"]
notes = '''
Write the prompt by prompt-guide.md, all of it except "Try Gemini Omni", and in omni.md only "Gemini Omni Flash prompt guide" with its subsections and "Best practices"; the rest of omni.md is API usage, and the API notes give its limits. video-gen-prompt-guide.md, written for Veo and Gemini Omni, explains subject, action, camera, lens, style, lighting and audio terms: read the sections the prompt needs, and skip "Safety filters" and "What's next".
The tool writes the [# Sources ...] and [# References ...] declarations, so the prompt uses only the simple tags from "Using tags in prompts to set image and video roles": <FIRST_FRAME>, <LAST_FRAME>, <IMAGE_REF_N> for reference_images and <VIDEO_REF_N> for reference_videos, counting from 0. In the declarations' examples, Image1, Image2 count the frames first, then the reference images; Video1 counts the reference videos.
Timing goes in the prompt.
'''
