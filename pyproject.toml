[project]
name = "multimodal-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vigilans", email = "vigilans@foxmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.0",
    "httpx>=0.28.1",
    "openai>=3.28.0",
    "pydantic>=2.14.0",
    "pydantic-ai-harness>=0.66",
    "pydantic-ai-slim[openai]>=2.66",
    "static-ffmpeg>=3.0",
    "websockets>=15",
]

[project.scripts]
multimodal-mcp = "multimodal_mcp:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Reference files get_model_guide downloads at run time.
source-exclude = ["src/multimodal_mcp/catalog/references"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
