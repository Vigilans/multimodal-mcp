[project]
name = "multimodal-mcp"
version = "0.3.0.post1"
description = "MCP server for image generation and editing, speech recognition, text recognition, speech synthesis, voice design, video generation and multimodal media analysis."
keywords = ["mcp", "mcp-server", "multimodal", "image-generation", "image-editing", "speech-recognition", "asr", "text-recognition", "ocr", "speech-synthesis", "tts", "voice-design", "video-generation"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vigilans", email = "vigilans@foxmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.0",
    "httpx>=0.28.1",
    "openai>=3.28.0",
    "pydantic>=2.14.0",
    "pydantic-ai-harness>=0.66",
    "pydantic-ai-slim[openai]>=2.66",
    "static-ffmpeg>=3.0",
    "websockets>=15",
]

[project.urls]
Repository = "https://github.com/Vigilans/multimodal-mcp"

[project.scripts]
multimodal-mcp = "multimodal_mcp:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
